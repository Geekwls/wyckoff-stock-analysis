[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wyckoff-stock-analysis"
version = "2.0.0"
description = "Professional Wyckoff stock analysis toolkit"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=1.3.0,<2.0.0",
    "baostock>=0.8.8",
    "pandas>=3.0.0,<4.0.0",
    "requests>=2.31.0",
    "pydantic>=2.13.0,<3.0.0",
    "tqdm>=4.65.0",
    "numpy>=2.4.0,<3.0.0",
    "mcp>=1.0.0",
    "akshare>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wyckoff*"]

[project.scripts]
wyckoff-analysis = "apps.cli.main:main"
wyckoff-mcp = "apps.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

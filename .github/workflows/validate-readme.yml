name: Validate README Claims

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-readme:
    runs-on: ubuntu-latest
    name: Check README declarations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run README validation script
        run: |
          python scripts/check_repo_claims.py --ci

      - name: Comment PR with results (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔍 README 声明校验结果\n\n';
            comment += '✅ 所有检查通过！README 中的关键声明与仓库状态一致。\n\n';
            comment += '建议在合并前人工审查项目导航部分是否需要更新。\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

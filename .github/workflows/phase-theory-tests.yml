name: Phase Theory Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  phase-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run phase theory unit tests (unittest)
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_phase*.py' -q

      - name: Run legacy unittest suite (non-pytest)
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.test_theory_fix \
            tests.test_batch_scan \
            tests.test_mcp_compatibility \
            tests.test_lps_lpsy \
            tests.test_cache_consistency \
            -q

      - name: Run pytest suite
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/ -q --tb=no
